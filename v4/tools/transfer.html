<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trasferisci Dati — RunBase Tools</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { background: var(--bg); }
    .tools-page { padding-top: 72px; padding-bottom: 40px; }
    .log-box {
      background: #1a2415; color: #7fff90;
      border-radius: var(--radius); padding: 16px;
      font-family: monospace; font-size: .82rem;
      line-height: 1.7; max-height: 380px;
      overflow-y: auto; margin-top: 12px;
    }
    .log-err { color: #ff8080; }
    .log-ok  { color: #7fff90; }
    .log-info{ color: #80d4ff; }
  </style>
</head>
<body>
<div class="tools-page">
  <div class="tools-header">
    <a href="../index.html" class="btn btn-secondary" style="padding:8px 14px;font-size:.85rem">← Mappa</a>
    <h1>🔄 Trasferisci Dati</h1>
  </div>

  <div class="tools-section">
    <div class="tools-section-header">
      <h2>Esporta dati (JSON)</h2>
    </div>
    <div class="tools-section-body">
      <p style="font-size:.85rem;color:var(--text-muted);margin-bottom:12px">
        Scarica tutti i dati del progetto corrente come file JSON.
      </p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-primary" id="btn-export-spots">📦 Esporta Spots</button>
        <button class="btn btn-secondary" id="btn-export-config">⚙️ Esporta Config</button>
        <button class="btn btn-amber" id="btn-export-all">💾 Esporta Tutto</button>
      </div>
    </div>
  </div>

  <div class="tools-section">
    <div class="tools-section-header">
      <h2>Importa dati (JSON)</h2>
    </div>
    <div class="tools-section-body">
      <p style="font-size:.85rem;color:var(--text-muted);margin-bottom:12px">
        Importa un file JSON esportato in precedenza.
      </p>
      <div class="photo-upload-area" id="import-drop" style="margin-bottom:12px">
        <div class="ico">📂</div>
        <p>Tocca per selezionare il file JSON</p>
      </div>
      <input type="file" id="import-file" accept=".json" style="display:none">
      <button class="btn btn-danger" id="btn-import" disabled>⬆️ Importa nel progetto corrente</button>
    </div>
  </div>

  <div class="tools-section">
    <div class="tools-section-header">
      <h2>Log operazioni</h2>
    </div>
    <div class="tools-section-body">
      <div class="log-box" id="log">Pronto.</div>
    </div>
  </div>
</div>

<script type="module">
import { db, collection, getDocs, doc, setDoc, addDoc } from '../js/firebase-raw.js';

const log = document.getElementById('log');
function addLog(msg, type = 'ok') {
  log.innerHTML += `<div class="log-${type}">${new Date().toLocaleTimeString('it')} — ${msg}</div>`;
  log.scrollTop = log.scrollHeight;
}

// ── Esporta Spots ─────────────────────────────────────────────
document.getElementById('btn-export-spots').addEventListener('click', async () => {
  addLog('Leggo spots da Firestore…', 'info');
  try {
    const snap = await getDocs(collection(db, 'spots'));
    const spots = {};
    snap.forEach(d => { spots[d.id] = d.data(); });
    download('runbase-spots.json', JSON.stringify(spots, null, 2));
    addLog(`✅ ${Object.keys(spots).length} spots esportati`, 'ok');
  } catch(e) { addLog('❌ ' + e.message, 'err'); }
});

// ── Esporta Config ────────────────────────────────────────────
document.getElementById('btn-export-config').addEventListener('click', async () => {
  addLog('Leggo config da Firestore…', 'info');
  try {
    const snap = await getDocs(collection(db, 'tools'));
    const cfg = {};
    snap.forEach(d => { cfg[d.id] = d.data(); });
    download('runbase-config.json', JSON.stringify(cfg, null, 2));
    addLog('✅ Config esportata', 'ok');
  } catch(e) { addLog('❌ ' + e.message, 'err'); }
});

// ── Esporta Tutto ─────────────────────────────────────────────
document.getElementById('btn-export-all').addEventListener('click', async () => {
  addLog('Esportazione completa…', 'info');
  try {
    const [spotsSnap, toolsSnap] = await Promise.all([
      getDocs(collection(db, 'spots')),
      getDocs(collection(db, 'tools'))
    ]);
    const out = { spots: {}, tools: {} };
    spotsSnap.forEach(d => { out.spots[d.id] = d.data(); });
    toolsSnap.forEach(d => { out.tools[d.id] = d.data(); });
    download('runbase-backup.json', JSON.stringify(out, null, 2));
    addLog(`✅ Backup completo: ${Object.keys(out.spots).length} spots, ${Object.keys(out.tools).length} config docs`, 'ok');
  } catch(e) { addLog('❌ ' + e.message, 'err'); }
});

// ── Import ────────────────────────────────────────────────────
let importData = null;
document.getElementById('import-drop').addEventListener('click', () =>
  document.getElementById('import-file').click()
);
document.getElementById('import-file').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      importData = JSON.parse(ev.target.result);
      document.getElementById('btn-import').disabled = false;
      addLog(`📂 File caricato: ${file.name}`, 'info');
      if (importData.spots) addLog(`   → ${Object.keys(importData.spots).length} spots`, 'info');
      if (importData.tools) addLog(`   → config tools`, 'info');
    } catch(err) { addLog('❌ JSON non valido: ' + err.message, 'err'); }
  };
  reader.readAsText(file);
});

document.getElementById('btn-import').addEventListener('click', async () => {
  if (!importData) return;
  if (!confirm('Importare i dati? I documenti esistenti con lo stesso ID saranno sovrascritti.')) return;

  addLog('⬆️ Avvio importazione…', 'info');
  try {
    if (importData.spots) {
      let n = 0;
      for (const [id, data] of Object.entries(importData.spots)) {
        // Converti timestamp serializzati
        const cleaned = JSON.parse(JSON.stringify(data));
        await addDoc(collection(db, 'spots'), cleaned);
        n++;
      }
      addLog(`✅ ${n} spots importati`, 'ok');
    }
    if (importData.tools) {
      for (const [id, data] of Object.entries(importData.tools)) {
        await setDoc(doc(db, 'tools', id), data);
      }
      addLog('✅ Config tools importata', 'ok');
    }
    // Caso: export solo spots (senza wrapper)
    if (!importData.spots && !importData.tools) {
      let n = 0;
      for (const data of Object.values(importData)) {
        await addDoc(collection(db, 'spots'), data);
        n++;
      }
      addLog(`✅ ${n} spots importati (formato flat)`, 'ok');
    }
    addLog('🎉 Importazione completata!', 'ok');
  } catch(e) { addLog('❌ Errore: ' + e.message, 'err'); }
});

function download(filename, text) {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(text);
  a.download = filename;
  a.click();
}
</script>
</body>
</html>
