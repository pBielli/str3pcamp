<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Categorie — RunBase Tools</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { background: var(--bg); }
    .tools-page { padding-top: 72px; padding-bottom: 40px; }

    /* Tabs */
    .cat-tabs {
      display: flex; gap: 4px; overflow-x: auto;
      padding: 0 0 4px; margin-bottom: 20px;
      scrollbar-width: none;
    }
    .cat-tab {
      padding: 8px 16px;
      border: 1.5px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      font-size: .82rem; font-weight: 600;
      color: var(--text-muted);
      cursor: pointer; white-space: nowrap;
      transition: all .2s;
    }
    .cat-tab.active { background: var(--green); border-color: var(--green); color: #fff; }

    /* Panels */
    .cat-panel { display: none; }
    .cat-panel.active { display: block; }

    /* Rows */
    .item-row {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 0; border-bottom: 1px solid var(--border);
    }
    .item-row:last-child { border-bottom: none; }
    .item-row .drag-handle {
      color: var(--text-light); cursor: grab; font-size: 1.1rem; padding: 4px;
    }
    .item-row input[type=text] {
      flex: 1; padding: 8px 10px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: .88rem; color: var(--text);
      background: var(--surface); outline: none;
    }
    .item-row input[type=text]:focus { border-color: var(--green); }
    .item-row input[type=color] {
      width: 36px; height: 36px;
      border-radius: 8px; border: 1.5px solid var(--border);
      cursor: pointer; padding: 2px; background: var(--surface);
    }
    .item-row .emoji-input { width: 60px; text-align: center; font-size: 1.2rem; }
    .btn-del {
      width: 34px; height: 34px; border: none;
      border-radius: 50%; background: var(--red-light);
      color: var(--red); font-size: 1rem;
      cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-del:hover { background: var(--red); color: #fff; }

    .add-row {
      display: flex; gap: 8px; margin-top: 12px;
    }

    .save-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--surface); border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: flex; gap: 8px;
      box-shadow: 0 -4px 16px rgba(0,0,0,.08);
      z-index: 100;
    }

    .status-bar {
      padding: 8px 12px; border-radius: 8px;
      font-size: .82rem; font-weight: 600;
      margin-bottom: 12px; display: none;
    }
    .status-bar.show { display: block; }
    .status-ok  { background: var(--green-faded); color: var(--green); }
    .status-err { background: var(--red-light); color: var(--red); }
  </style>
</head>
<body>
<div class="tools-page">
  <div class="tools-header">
    <a href="../index.html" class="btn btn-secondary" style="padding:8px 14px;font-size:.85rem">← Mappa</a>
    <h1>⚙️ Gestisci Categorie</h1>
  </div>

  <div id="status" class="status-bar"></div>

  <div class="cat-tabs" id="cat-tabs">
    <button class="cat-tab active" data-tab="spotTypes">Tipi Posto</button>
    <button class="cat-tab" data-tab="vehicles">Veicoli</button>
    <button class="cat-tab" data-tab="services">Servizi</button>
    <button class="cat-tab" data-tab="environmentTags">Ambienti</button>
  </div>

  <!-- Pannello Tipi Posto -->
  <div class="cat-panel active tools-section" id="panel-spotTypes">
    <div class="tools-section-header">
      <h2>Tipi di posto</h2>
      <span style="font-size:.78rem;color:var(--text-muted)">chiave · etichetta · colore · marker</span>
    </div>
    <div class="tools-section-body">
      <div id="list-spotTypes"></div>
      <div class="add-row">
        <input type="text" id="new-spot-key" placeholder="chiave (es: agriturismo)" style="flex:1">
        <input type="text" id="new-spot-label" placeholder="Etichetta" style="flex:1.2">
        <input type="color" id="new-spot-color" value="#4a9a5e">
        <input type="color" id="new-spot-marker" value="#2a6a38">
        <button class="btn btn-primary" id="btn-add-spot" style="padding:8px 14px">+ Aggiungi</button>
      </div>
    </div>
  </div>

  <!-- Pannello Veicoli -->
  <div class="cat-panel tools-section" id="panel-vehicles">
    <div class="tools-section-header">
      <h2>Veicoli</h2>
      <span style="font-size:.78rem;color:var(--text-muted)">chiave · emoji · etichetta</span>
    </div>
    <div class="tools-section-body">
      <div id="list-vehicles"></div>
      <div class="add-row">
        <input type="text" id="new-veh-key" placeholder="chiave (es: camper)" style="flex:1">
        <input type="text" id="new-veh-emoji" placeholder="🚌" class="emoji-input" style="width:70px">
        <input type="text" id="new-veh-label" placeholder="Etichetta" style="flex:1.5">
        <button class="btn btn-primary" id="btn-add-veh" style="padding:8px 14px">+ Aggiungi</button>
      </div>
    </div>
  </div>

  <!-- Pannello Servizi -->
  <div class="cat-panel tools-section" id="panel-services">
    <div class="tools-section-header">
      <h2>Servizi</h2>
      <span style="font-size:.78rem;color:var(--text-muted)">chiave · etichetta (con emoji)</span>
    </div>
    <div class="tools-section-body">
      <div id="list-services"></div>
      <div class="add-row">
        <input type="text" id="new-svc-key" placeholder="chiave (es: lavatrice)" style="flex:1">
        <input type="text" id="new-svc-label" placeholder="🧺 Lavatrice" style="flex:2">
        <button class="btn btn-primary" id="btn-add-svc" style="padding:8px 14px">+ Aggiungi</button>
      </div>
    </div>
  </div>

  <!-- Pannello Ambienti -->
  <div class="cat-panel tools-section" id="panel-environmentTags">
    <div class="tools-section-header">
      <h2>Tag Ambiente</h2>
    </div>
    <div class="tools-section-body">
      <div id="list-environmentTags"></div>
      <div class="add-row">
        <input type="text" id="new-tag" placeholder="🌋 Vulcano" style="flex:1">
        <button class="btn btn-primary" id="btn-add-tag" style="padding:8px 14px">+ Aggiungi</button>
      </div>
    </div>
  </div>

  <div style="height:80px"></div>
</div>

<div class="save-bar">
  <button class="btn btn-secondary" style="flex:1" id="btn-reload">🔄 Ricarica da Firestore</button>
  <button class="btn btn-primary" style="flex:2" id="btn-save">💾 Salva tutto su Firestore</button>
</div>

<script type="module">
import { db, doc, setDoc, getDoc, collection, getDocs } from '../js/firebase-raw.js';

// Stato locale
let data = { spotTypes: {}, vehicles: {}, services: {}, environmentTags: { list: [] } };

// ── Carica da Firestore ─────────────────────────────────────────
async function loadFromFirestore() {
  showStatus('⏳ Carico da Firestore…', 'ok');
  try {
    for (const key of ['spotTypes','vehicles','services','environmentTags']) {
      const snap = await getDoc(doc(db, 'tools', key));
      if (snap.exists()) data[key] = snap.data();
    }
    renderAll();
    showStatus('✅ Dati caricati da Firestore', 'ok');
  } catch(e) {
    showStatus('❌ Errore caricamento: ' + e.message, 'err');
    // Fallback: config.json
    try {
      const cfg = await (await fetch('../config.json')).json();
      data.spotTypes = cfg.spotTypes || {};
      data.vehicles  = cfg.vehicles  || {};
      data.services  = cfg.services  || {};
      data.environmentTags = { list: cfg.environmentTags || [] };
      renderAll();
      showStatus('⚠️ Usato config.json locale (Firestore non raggiungibile)', 'ok');
    } catch(e2) {
      showStatus('❌ Impossibile caricare dati: ' + e2.message, 'err');
    }
  }
}

// ── Salva su Firestore ──────────────────────────────────────────
async function saveToFirestore() {
  showStatus('⏳ Salvo su Firestore…', 'ok');
  try {
    await setDoc(doc(db, 'tools', 'spotTypes'),       data.spotTypes);
    await setDoc(doc(db, 'tools', 'vehicles'),        data.vehicles);
    await setDoc(doc(db, 'tools', 'services'),        data.services);
    await setDoc(doc(db, 'tools', 'environmentTags'), data.environmentTags);
    showStatus('✅ Salvato correttamente su Firestore!', 'ok');
  } catch(e) {
    showStatus('❌ Errore salvataggio: ' + e.message, 'err');
  }
}

// ── Render ──────────────────────────────────────────────────────
function renderAll() {
  renderSpotTypes();
  renderVehicles();
  renderServices();
  renderEnvTags();
}

function renderSpotTypes() {
  const el = document.getElementById('list-spotTypes');
  el.innerHTML = Object.entries(data.spotTypes).map(([key, t]) => `
    <div class="item-row" data-key="${key}">
      <span class="drag-handle">⠿</span>
      <input type="text" class="st-key" value="${key}" placeholder="chiave" style="max-width:110px">
      <input type="text" class="st-label" value="${t.label||''}" placeholder="Etichetta">
      <input type="color" class="st-color" value="${t.color||'#4a9a5e'}">
      <input type="color" class="st-marker" value="${t.markerColor||'#2a6a38'}">
      <button class="btn-del" data-del-spot="${key}">🗑</button>
    </div>`).join('');

  el.querySelectorAll('[data-del-spot]').forEach(btn => {
    btn.addEventListener('click', () => {
      delete data.spotTypes[btn.dataset.delSpot];
      renderSpotTypes();
    });
  });
  // Sync on change
  el.querySelectorAll('.item-row').forEach(row => {
    ['st-key','st-label','st-color','st-marker'].forEach(cls => {
      row.querySelector(`.${cls}`)?.addEventListener('input', () => syncSpotTypes());
    });
  });
}

function syncSpotTypes() {
  const newData = {};
  document.querySelectorAll('#list-spotTypes .item-row').forEach(row => {
    const key    = row.querySelector('.st-key').value.trim();
    const label  = row.querySelector('.st-label').value.trim();
    const color  = row.querySelector('.st-color').value;
    const marker = row.querySelector('.st-marker').value;
    if (key) newData[key] = { label, color, markerColor: marker };
  });
  data.spotTypes = newData;
}

document.getElementById('btn-add-spot').addEventListener('click', () => {
  const key    = document.getElementById('new-spot-key').value.trim();
  const label  = document.getElementById('new-spot-label').value.trim();
  const color  = document.getElementById('new-spot-color').value;
  const marker = document.getElementById('new-spot-marker').value;
  if (!key || !label) { showStatus('⚠️ Chiave ed etichetta richiesti', 'err'); return; }
  data.spotTypes[key] = { label, color, markerColor: marker };
  renderSpotTypes();
  ['new-spot-key','new-spot-label'].forEach(id => document.getElementById(id).value = '');
});

// ── Veicoli ───────────────────────────────────────────────────
function renderVehicles() {
  const el = document.getElementById('list-vehicles');
  el.innerHTML = Object.entries(data.vehicles).map(([key, v]) => `
    <div class="item-row" data-key="${key}">
      <input type="text" value="${key}" class="veh-key" placeholder="chiave" style="max-width:110px">
      <input type="text" value="${v.emoji||''}" class="veh-emoji emoji-input">
      <input type="text" value="${v.label||''}" class="veh-label" placeholder="Etichetta">
      <button class="btn-del" data-del-veh="${key}">🗑</button>
    </div>`).join('');

  el.querySelectorAll('[data-del-veh]').forEach(btn => {
    btn.addEventListener('click', () => { delete data.vehicles[btn.dataset.delVeh]; renderVehicles(); });
  });
}

document.getElementById('btn-add-veh').addEventListener('click', () => {
  const key   = document.getElementById('new-veh-key').value.trim();
  const emoji = document.getElementById('new-veh-emoji').value.trim();
  const label = document.getElementById('new-veh-label').value.trim();
  if (!key || !label) { showStatus('⚠️ Chiave ed etichetta richiesti', 'err'); return; }
  data.vehicles[key] = { label, emoji };
  renderVehicles();
  ['new-veh-key','new-veh-emoji','new-veh-label'].forEach(id => document.getElementById(id).value = '');
});

// ── Servizi ───────────────────────────────────────────────────
function renderServices() {
  const el = document.getElementById('list-services');
  el.innerHTML = Object.entries(data.services).map(([key, label]) => `
    <div class="item-row">
      <input type="text" value="${key}" class="svc-key" placeholder="chiave" style="max-width:130px">
      <input type="text" value="${label}" class="svc-label" placeholder="Etichetta">
      <button class="btn-del" data-del-svc="${key}">🗑</button>
    </div>`).join('');

  el.querySelectorAll('[data-del-svc]').forEach(btn => {
    btn.addEventListener('click', () => { delete data.services[btn.dataset.delSvc]; renderServices(); });
  });
}

document.getElementById('btn-add-svc').addEventListener('click', () => {
  const key   = document.getElementById('new-svc-key').value.trim();
  const label = document.getElementById('new-svc-label').value.trim();
  if (!key || !label) { showStatus('⚠️ Chiave ed etichetta richiesti', 'err'); return; }
  data.services[key] = label;
  renderServices();
  ['new-svc-key','new-svc-label'].forEach(id => document.getElementById(id).value = '');
});

// ── Tag Ambiente ──────────────────────────────────────────────
function renderEnvTags() {
  const el = document.getElementById('list-environmentTags');
  const list = data.environmentTags?.list || [];
  el.innerHTML = list.map((tag, i) => `
    <div class="item-row">
      <input type="text" value="${tag}" class="tag-val" data-i="${i}">
      <button class="btn-del" data-del-tag="${i}">🗑</button>
    </div>`).join('');

  el.querySelectorAll('[data-del-tag]').forEach(btn => {
    btn.addEventListener('click', () => {
      data.environmentTags.list.splice(+btn.dataset.delTag, 1);
      renderEnvTags();
    });
  });
  el.querySelectorAll('.tag-val').forEach(inp => {
    inp.addEventListener('input', () => {
      data.environmentTags.list[+inp.dataset.i] = inp.value;
    });
  });
}

document.getElementById('btn-add-tag').addEventListener('click', () => {
  const val = document.getElementById('new-tag').value.trim();
  if (!val) return;
  (data.environmentTags.list = data.environmentTags.list || []).push(val);
  renderEnvTags();
  document.getElementById('new-tag').value = '';
});

// ── Tabs ──────────────────────────────────────────────────────
document.getElementById('cat-tabs').addEventListener('click', e => {
  const tab = e.target.closest('.cat-tab');
  if (!tab) return;
  document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.cat-panel').forEach(p => p.classList.remove('active'));
  tab.classList.add('active');
  document.getElementById('panel-' + tab.dataset.tab)?.classList.add('active');
});

// ── Status ────────────────────────────────────────────────────
function showStatus(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = `status-bar show status-${type}`;
  setTimeout(() => el.classList.remove('show'), 4000);
}

// ── Init ──────────────────────────────────────────────────────
document.getElementById('btn-save').addEventListener('click', () => {
  syncSpotTypes(); // forza sync prima di salvare
  saveToFirestore();
});
document.getElementById('btn-reload').addEventListener('click', loadFromFirestore);

loadFromFirestore();
</script>
</body>
</html>
