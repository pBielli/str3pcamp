<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a1409">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Categorie · Str3pcamp</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Crimson+Pro:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg-deep: #060d06; --bg-dark: #0a1409; --bg-card: #0e1c0f; --bg-input: #0d1a0e;
  --border-dim: #182c1b; --border-mid: #1e3d22; --border-hi: #2d6035;
  --accent: #3d8a4e; --accent-hi: #4da862;
  --text-dim: #2d5a32; --text-mid: #4a7a4e; --text-lo: #6a9a6e;
  --text-main: #a8d4a8; --text-hi: #c8e4b8; --text-body: #e0e8d8;
  --gold: #f0b429;
}
html, body { min-height: 100%; background: var(--bg-deep); color: var(--text-body); font-family: 'Crimson Pro', Georgia, serif; -webkit-font-smoothing: antialiased; }
::-webkit-scrollbar { width: 3px; } ::-webkit-scrollbar-track { background: var(--bg-dark); } ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }
body { padding: 0 0 80px; }

.page-header { padding: 16px 16px 0; }
.page-title { font-size: 22px; font-weight: 300; color: var(--text-main); }
.page-sub { font-family: 'Space Mono', monospace; font-size: 9px; color: var(--text-dim); letter-spacing: 2px; text-transform: uppercase; margin-top: 3px; }
.page-status { font-family: 'Space Mono', monospace; font-size: 10px; margin-top: 8px; padding: 5px 10px; border-radius: 6px; background: var(--bg-card); border: 1px solid var(--border-dim); display: inline-block; }
.page-status.ok { color: var(--accent-hi); border-color: var(--border-hi); }
.page-status.err { color: #e48080; border-color: #5a2020; }
.page-status.loading { color: var(--gold); border-color: #5a4a20; }

.sections { padding: 16px; display: flex; flex-direction: column; gap: 20px; }

.section-card { background: var(--bg-card); border: 1px solid var(--border-dim); border-radius: 12px; overflow: hidden; }
.section-head { display: flex; align-items: center; justify-content: space-between; padding: 13px 14px; border-bottom: 1px solid var(--border-dim); }
.section-title { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--text-mid); letter-spacing: 1px; text-transform: uppercase; }
.section-count { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--text-dim); background: var(--bg-deep); padding: 2px 7px; border-radius: 10px; border: 1px solid var(--border-dim); }

.items-list { min-height: 30px; }
.item-row { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--bg-dark); transition: background .15s; }
.item-row:last-child { border-bottom: none; }
.item-row:hover { background: var(--bg-dark); }
.item-key { font-family: 'Space Mono', monospace; font-size: 9px; color: var(--text-dim); letter-spacing: .5px; min-width: 70px; flex-shrink: 0; }
.item-preview { flex: 1; font-size: 13px; color: var(--text-lo); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-swatch { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; border: 1px solid rgba(255,255,255,.15); }
.item-del { background: none; border: 1px solid #3a2020; color: #7a4040; padding: 4px 8px; border-radius: 5px; font-size: 10px; cursor: pointer; flex-shrink: 0; transition: all .2s; font-family: 'Space Mono', monospace; }
.item-del:hover { background: #2a1212; border-color: #8a3030; color: #e48080; }

.add-form { padding: 12px 14px; border-top: 1px solid var(--border-dim); background: var(--bg-deep); display: flex; flex-direction: column; gap: 8px; }
.add-form-title { font-family: 'Space Mono', monospace; font-size: 9px; color: var(--text-dim); letter-spacing: 1px; text-transform: uppercase; }
.add-row { display: flex; gap: 7px; flex-wrap: wrap; }
.finput {
  flex: 1; min-width: 80px; background: var(--bg-input); border: 1px solid var(--border-dim); border-radius: 7px;
  color: var(--text-body); font-family: 'Crimson Pro', Georgia, serif; font-size: 14px; padding: 8px 11px;
  outline: none; transition: border-color .2s;
}
.finput:focus { border-color: var(--accent); }
.finput::placeholder { color: var(--text-dim); font-size: 12px; }
.btn-add {
  background: #1e4a28; border: 1px solid var(--accent); color: #a8e4a8;
  padding: 8px 14px; border-radius: 7px; font-family: 'Space Mono', monospace;
  font-size: 10px; letter-spacing: .3px; cursor: pointer; transition: all .2s; white-space: nowrap;
}
.btn-add:hover:not(:disabled) { background: #2a6a38; }
.btn-add:disabled { opacity: .4; cursor: not-allowed; }
.color-pair { display: flex; gap: 7px; align-items: center; }
.flabel { font-family: 'Space Mono', monospace; font-size: 9px; color: var(--text-dim); letter-spacing: .8px; text-transform: uppercase; }

.empty-msg { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--text-dim); padding: 14px; text-align: center; }

/* Save button */
.save-bar { position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 16px; background: linear-gradient(0deg, var(--bg-deep), transparent); pointer-events: none; }
.btn-save { display: block; width: 100%; pointer-events: all; background: var(--accent); border: none; color: #fff; padding: 14px; border-radius: 10px; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 1px; cursor: pointer; transition: all .2s; }
.btn-save:hover:not(:disabled) { background: var(--accent-hi); }
.btn-save:disabled { opacity: .4; cursor: not-allowed; }
.btn-save:active:not(:disabled) { transform: scale(.98); }

/* Color input */
input[type="color"] { width: 36px; height: 36px; border: 1px solid var(--border-dim); border-radius: 6px; background: var(--bg-input); padding: 2px; cursor: pointer; }
</style>
</head>
<body>

<div class="page-header">
  <div class="page-title">🏷️ Categorie</div>
  <div class="page-sub">gestione dinamica delle categorie</div>
  <div class="page-status loading" id="page-status">⏳ Connessione...</div>
</div>

<div class="sections" id="sections">
  <!-- Rendered by JS -->
</div>

<div class="save-bar">
  <button class="btn-save" id="btn-save" disabled>💾 SALVA TUTTO SU FIREBASE</button>
</div>

<div id="toast" style="position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1a3d1f;color:#a8e4a8;padding:10px 18px;border-radius:8px;font-family:'Space Mono',monospace;font-size:11px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9998;border:1px solid #2a6a38;white-space:nowrap"></div>

<script type="module">
import { initToolbar } from '../js/toolbar.js';

const config = await fetch('../config.json').then(r => r.json());
const fbResult = await initToolbar({ title: 'CATEGORIE', firebaseConfig: config.firebase, currentPage: 'categories' });

// ── FIREBASE ──────────────────────────────────────────────────
const { initializeApp, getApps } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
const { getFirestore, doc, getDoc, setDoc } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
const { getAuth, onAuthStateChanged } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js');

const app = getApps().length ? getApps()[0] : initializeApp(config.firebase);
const db  = getFirestore(app);
const auth = getAuth(app);

let currentUser = null;
onAuthStateChanged(auth, u => {
  currentUser = u;
  document.getElementById('btn-save').disabled = !u;
});

// ── LOCAL STATE ───────────────────────────────────────────────
// Start with config.json defaults
let appConfig = {
  spotTypes:       JSON.parse(JSON.stringify(config.spotTypes)),
  vehicles:        JSON.parse(JSON.stringify(config.vehicles)),
  environmentTags: [...config.environmentTags],
  services:        JSON.parse(JSON.stringify(config.services)),
};

// Try to load from Firebase
try {
  const snap = await getDoc(doc(db, 'appConfig', 'main'));
  if (snap.exists()) {
    const d = snap.data();
    if (d.spotTypes)       appConfig.spotTypes       = d.spotTypes;
    if (d.vehicles)        appConfig.vehicles        = d.vehicles;
    if (d.environmentTags) appConfig.environmentTags = d.environmentTags;
    if (d.services)        appConfig.services        = d.services;
    setStatus('ok', '☁️ Config da Firebase');
  } else {
    setStatus('ok', '☁️ Connesso · nessun config remoto');
  }
} catch(e) {
  setStatus('err', '⚠️ ' + (e.message || 'Errore'));
}

// ── RENDER ────────────────────────────────────────────────────
function render() {
  const root = document.getElementById('sections');
  root.innerHTML = '';
  root.appendChild(renderSpotTypes());
  root.appendChild(renderVehicles());
  root.appendChild(renderEnvTags());
  root.appendChild(renderServices());
}

function renderSpotTypes() {
  const card = makeCard('🏕️ TIPI DI POSTO', Object.keys(appConfig.spotTypes).length);
  const list = card.querySelector('.items-list');

  Object.entries(appConfig.spotTypes).forEach(([key, val]) => {
    const row = document.createElement('div');
    row.className = 'item-row';
    row.innerHTML = `
      <span class="item-key">${key}</span>
      <div class="item-swatch" style="background:${val.color}"></div>
      <span class="item-preview">${val.label}</span>
      <button class="item-del" data-key="${key}">✕</button>
    `;
    row.querySelector('.item-del').onclick = () => { delete appConfig.spotTypes[key]; render(); };
    list.appendChild(row);
  });

  // Add form
  const form = document.createElement('div');
  form.className = 'add-form';
  form.innerHTML = `
    <div class="add-form-title">Aggiungi tipo</div>
    <div class="add-row">
      <input class="finput" id="st-key" placeholder="chiave (es. bivacco)" style="max-width:120px">
      <input class="finput" id="st-label" placeholder="etichetta (es. Bivacco)">
    </div>
    <div class="add-row" style="align-items:center;gap:12px">
      <div>
        <div class="flabel" style="margin-bottom:5px">Colore principale</div>
        <input type="color" id="st-color" value="#3d8a4e">
      </div>
      <div>
        <div class="flabel" style="margin-bottom:5px">Colore marker</div>
        <input type="color" id="st-mcolor" value="#2a6a38">
      </div>
      <button class="btn-add" id="st-add" style="margin-top:16px">+ AGGIUNGI</button>
    </div>
  `;
  form.querySelector('#st-add').onclick = () => {
    const key    = form.querySelector('#st-key').value.trim().toLowerCase();
    const label  = form.querySelector('#st-label').value.trim();
    const color  = form.querySelector('#st-color').value;
    const mcolor = form.querySelector('#st-mcolor').value;
    if (!key || !label) { toast('Chiave e etichetta obbligatori', 'err'); return; }
    appConfig.spotTypes[key] = { label, color, markerColor: mcolor };
    render();
  };
  card.appendChild(form);
  return card;
}

function renderVehicles() {
  const card = makeCard('🚐 VEICOLI', Object.keys(appConfig.vehicles).length);
  const list = card.querySelector('.items-list');

  Object.entries(appConfig.vehicles).forEach(([key, val]) => {
    const row = document.createElement('div');
    row.className = 'item-row';
    row.innerHTML = `
      <span class="item-key">${key}</span>
      <span style="font-size:18px">${val.emoji || ''}</span>
      <span class="item-preview">${val.label}</span>
      <button class="item-del" data-key="${key}">✕</button>
    `;
    row.querySelector('.item-del').onclick = () => { delete appConfig.vehicles[key]; render(); };
    list.appendChild(row);
  });

  const form = document.createElement('div');
  form.className = 'add-form';
  form.innerHTML = `
    <div class="add-form-title">Aggiungi veicolo</div>
    <div class="add-row">
      <input class="finput" id="veh-key"   placeholder="chiave (es. moto)" style="max-width:110px">
      <input class="finput" id="veh-label" placeholder="etichetta (es. MOTO)">
      <input class="finput" id="veh-emoji" placeholder="emoji 🏍️" style="max-width:70px">
    </div>
    <button class="btn-add" id="veh-add">+ AGGIUNGI</button>
  `;
  form.querySelector('#veh-add').onclick = () => {
    const key   = form.querySelector('#veh-key').value.trim().toLowerCase();
    const label = form.querySelector('#veh-label').value.trim();
    const emoji = form.querySelector('#veh-emoji').value.trim();
    if (!key || !label) { toast('Chiave e etichetta obbligatori', 'err'); return; }
    appConfig.vehicles[key] = { label, emoji };
    render();
  };
  card.appendChild(form);
  return card;
}

function renderEnvTags() {
  const card = makeCard('🌄 AMBIENTI', appConfig.environmentTags.length);
  const list = card.querySelector('.items-list');

  appConfig.environmentTags.forEach((tag, i) => {
    const row = document.createElement('div');
    row.className = 'item-row';
    row.innerHTML = `
      <span class="item-preview" style="flex:1">${tag}</span>
      <button class="item-del" data-i="${i}">✕</button>
    `;
    row.querySelector('.item-del').onclick = () => { appConfig.environmentTags.splice(i, 1); render(); };
    list.appendChild(row);
  });

  const form = document.createElement('div');
  form.className = 'add-form';
  form.innerHTML = `
    <div class="add-form-title">Aggiungi ambiente</div>
    <div class="add-row">
      <input class="finput" id="env-tag" placeholder="🌋 Vulcano">
      <button class="btn-add" id="env-add">+ AGGIUNGI</button>
    </div>
  `;
  form.querySelector('#env-add').onclick = () => {
    const tag = form.querySelector('#env-tag').value.trim();
    if (!tag) { toast('Inserisci un ambiente', 'err'); return; }
    appConfig.environmentTags.push(tag);
    form.querySelector('#env-tag').value = '';
    render();
  };
  card.appendChild(form);
  return card;
}

function renderServices() {
  const card = makeCard('💧 SERVIZI', Object.keys(appConfig.services).length);
  const list = card.querySelector('.items-list');

  Object.entries(appConfig.services).forEach(([key, val]) => {
    const row = document.createElement('div');
    row.className = 'item-row';
    row.innerHTML = `
      <span class="item-key">${key}</span>
      <span class="item-preview">${val}</span>
      <button class="item-del" data-key="${key}">✕</button>
    `;
    row.querySelector('.item-del').onclick = () => { delete appConfig.services[key]; render(); };
    list.appendChild(row);
  });

  const form = document.createElement('div');
  form.className = 'add-form';
  form.innerHTML = `
    <div class="add-form-title">Aggiungi servizio</div>
    <div class="add-row">
      <input class="finput" id="svc-key"   placeholder="chiave (es. piscina)" style="max-width:110px">
      <input class="finput" id="svc-label" placeholder="🏊 Piscina">
    </div>
    <button class="btn-add" id="svc-add">+ AGGIUNGI</button>
  `;
  form.querySelector('#svc-add').onclick = () => {
    const key   = form.querySelector('#svc-key').value.trim().toLowerCase();
    const label = form.querySelector('#svc-label').value.trim();
    if (!key || !label) { toast('Chiave e etichetta obbligatori', 'err'); return; }
    appConfig.services[key] = label;
    render();
  };
  card.appendChild(form);
  return card;
}

function makeCard(title, count) {
  const card = document.createElement('div');
  card.className = 'section-card';
  card.innerHTML = `
    <div class="section-head">
      <span class="section-title">${title}</span>
      <span class="section-count">${count}</span>
    </div>
    <div class="items-list"></div>
  `;
  return card;
}

// ── SAVE ──────────────────────────────────────────────────────
document.getElementById('btn-save').onclick = async () => {
  if (!currentUser) { toast('Devi fare login per salvare', 'err'); return; }
  const btn = document.getElementById('btn-save');
  btn.disabled = true;
  btn.textContent = '⏳ Salvataggio...';
  try {
    await setDoc(doc(db, 'appConfig', 'main'), appConfig);
    toast('✓ Salvato su Firebase!', 'ok');
    setStatus('ok', '☁️ Config aggiornato');
  } catch(e) {
    toast('Errore: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = '💾 SALVA TUTTO SU FIREBASE';
  }
};

// ── HELPERS ───────────────────────────────────────────────────
function setStatus(type, text) {
  const el = document.getElementById('page-status');
  el.className = 'page-status ' + type;
  el.textContent = text;
}

let toastTimer;
function toast(msg, type = 'ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = type === 'err' ? '#3d1a1a' : '#1a3d1f';
  el.style.color       = type === 'err' ? '#e48080' : '#a8e4a8';
  el.style.borderColor = type === 'err' ? '#5a2020' : '#2a6a38';
  el.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.opacity = '0'; }, 2500);
}

render();
</script>
</body>
</html>
