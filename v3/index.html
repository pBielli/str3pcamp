<script type="module">
// ── BOOTSTRAP ────────────────────────────────────────────────
import * as Firebase from './js/firebase.js';
import * as Map      from './js/map.js';
import * as List     from './js/list.js';
import * as AddForm  from './js/addform.js';

// Load config
const config = await fetch('./config.json').then(r => r.json());
window.APP_CONFIG = config;

// Expose config constants for legacy access
const SPOT_TYPES = config.spotTypes;

// ── FILTER STATE ─────────────────────────────────────────────
let searchVal = '', filterVal = 'tutti';

function getFiltered() {
  const q = searchVal.toLowerCase();
  return Firebase.getSpots().filter(s =>
    (s.name.toLowerCase().includes(q) ||
     (s.region || '').toLowerCase().includes(q) ||
     (s.city   || '').toLowerCase().includes(q)) &&
    (filterVal === 'tutti' || s.spotType === filterVal)
  );
}

window._getFiltered = getFiltered;

// ── WIRE UP MODULES ───────────────────────────────────────────
Firebase.setOnSpotsChange(() => {
  Map.renderMarkers();
  if (document.getElementById('list-panel').classList.contains('active')) {
    List.renderList(getFiltered());
  }
});

// Init map
Map.initMap(config, SPOT_TYPES, (id) => Map.selectSpot(id), getFiltered);
window._map = Map.map;

// Firebase setSpots shim
window._setSpots = (arr) => Firebase.setSpots(arr);

// Expose globals needed by modules
window.toast       = toast;
window.switchPanel = switchPanel;
window.openEdit    = List.openEdit;
window.confirmDelete = List.confirmDelete;

// ── FIREBASE INIT ─────────────────────────────────────────────
Firebase.initFirebase(config.firebase, config.defaultSpots);

// ── NAV ───────────────────────────────────────────────────────
function switchPanel(name) {
  if (name === 'add' && !Firebase.currentUser) {
    toast('Accedi con Google per aggiungere luoghi 🔑', 'error');
    return;
  }
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(name + '-panel').classList.add('active');
  document.querySelector(`[data-panel="${name}"]`).classList.add('active');

  if (name === 'map')  setTimeout(() => Map.map.invalidateSize(), 50);
  if (name === 'list') List.renderList(getFiltered());
  if (name === 'add')  { AddForm.renderAddStep(); AddForm.onAddPanelOpen(); }
}

document.querySelectorAll('.nav-btn').forEach(b =>
  b.addEventListener('click', () => switchPanel(b.dataset.panel))
);

// Close detail on map click
Map.map.on('click', () => { if (Map.selectedId) Map.closeDetail(); });

// ── GPS BTN ───────────────────────────────────────────────────
document.getElementById('gps-btn').addEventListener('click', Map.startUserLocation);

// ── SEARCH & FILTER ───────────────────────────────────────────
document.getElementById('search-input').addEventListener('input', e => {
  searchVal = e.target.value;
  Map.renderMarkers();
  if (document.getElementById('list-panel').classList.contains('active')) List.renderList(getFiltered());
});

document.getElementById('filter-type').addEventListener('change', e => {
  filterVal = e.target.value;
  Map.renderMarkers();
  if (document.getElementById('list-panel').classList.contains('active')) List.renderList(getFiltered());
});

// ── TOAST ─────────────────────────────────────────────────────
let toastTimer;
function toast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ''; }, 3000);
}

// ── PWA INSTALL ───────────────────────────────────────────────
let deferredPrompt;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  const btn = document.getElementById('install-btn');
  btn.style.display = 'block';
  btn.onclick = async () => {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') toast('App installata! 🎉');
    deferredPrompt = null;
    btn.style.display = 'none';
  };
});

// PWA Manifest
const manifest = {
  name: config.app.name,
  short_name: config.app.shortName,
  description: config.app.description,
  start_url: '.',
  display: 'standalone',
  background_color: config.app.backgroundColor,
  theme_color: config.app.themeColor,
  icons: [{
    src: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="18" fill="%230a1409"/><text y="72" font-size="70" x="12">🏕️</text></svg>',
    sizes: 'any',
    type: 'image/svg+xml'
  }]
};
document.head.insertAdjacentHTML('beforeend',
  `<link rel="manifest" href="${URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/json' }))}">`
);

// ── AUTO-LOCATE USER ON MAP ───────────────────────────────────
// Silently place user marker on map load
if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(
    pos => Map.placeUserMarker(pos.coords.latitude, pos.coords.longitude),
    () => {}, // silent fail
    { enableHighAccuracy: false, timeout: 5000, maximumAge: 60000 }
  );
}

</script>
