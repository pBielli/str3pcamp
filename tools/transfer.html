<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Str3pcamp → Strepcamp · Migrazione DB</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Crimson+Pro:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0a1409;color:#e8ead6;font-family:'Crimson Pro',Georgia,serif;min-height:100vh;padding:24px 16px;}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:#1a2d1f}::-webkit-scrollbar-thumb{background:#3d6e47;border-radius:2px}

h1{font-size:22px;font-weight:300;color:#a8d4a8;margin-bottom:4px;}
.sub{font-family:'Space Mono',monospace;font-size:9px;color:#4a7a4e;letter-spacing:2px;text-transform:uppercase;margin-bottom:28px;}

.dbs{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:start;margin-bottom:24px;}
@media(max-width:600px){.dbs{grid-template-columns:1fr;} .arrow{transform:rotate(90deg);margin:0 auto;}}

.db-card{background:#0f1e12;border:1px solid #1e3d22;border-radius:12px;padding:16px;}
.db-card h2{font-size:13px;font-family:'Space Mono',monospace;color:#4a7a4e;letter-spacing:1px;margin-bottom:12px;}
.db-badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:10px;font-family:'Space Mono',monospace;background:#0a1409;border:1px solid #1e3d22;color:#3a6a3e;margin-bottom:10px;}
.db-badge.online{border-color:#2a5a2e;color:#7ab880;}
.db-badge.error{border-color:#5a2020;color:#e48080;}
.db-badge.loading{border-color:#5a4a20;color:#e8a030;}

.stat-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #0f1e12;font-size:13px;}
.stat-row:last-child{border-bottom:none;}
.stat-n{font-family:'Space Mono',monospace;font-size:18px;font-weight:700;color:#c8e4b8;}

.arrow{display:flex;align-items:center;justify-content:center;color:#3d6e47;font-size:28px;padding-top:48px;}

/* Spot list */
.spot-list{margin-top:10px;max-height:220px;overflow-y:auto;}
.spot-item{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;font-size:12px;color:#7a9a72;cursor:default;}
.spot-item:hover{background:#0a1409;}
.spot-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.dot-libero{background:#3d8a4e;}
.dot-camping{background:#3b7ade;}
.dot-accoglienza{background:#e8a030;}
.spot-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.spot-region{font-family:'Space Mono',monospace;font-size:9px;color:#2a5a2e;}

/* Migrate panel */
.migrate-panel{background:#0f1e12;border:1px solid #1e3d22;border-radius:12px;padding:20px;margin-bottom:20px;}
.migrate-panel h2{font-size:13px;font-family:'Space Mono',monospace;color:#4a7a4e;letter-spacing:1px;margin-bottom:16px;}

.options{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;}
.opt{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border-radius:8px;border:1px solid #1a3a1e;cursor:pointer;transition:all .2s;}
.opt:hover{border-color:#2a5a2e;}
.opt.sel{background:#0a1409;border-color:#3d8a4e;}
.opt input[type=radio]{accent-color:#3d8a4e;margin-top:2px;flex-shrink:0;}
.opt-title{font-size:14px;font-weight:600;color:#c8e4b8;margin-bottom:2px;}
.opt-desc{font-size:12px;color:#4a7a4e;line-height:1.5;}

.btn-migrate{background:#1e4a28;border:1px solid #3d8a4e;color:#a8e4a8;padding:13px 0;border-radius:8px;cursor:pointer;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.5px;width:100%;transition:all .2s;}
.btn-migrate:hover:not(:disabled){background:#2a6a38;}
.btn-migrate:disabled{opacity:.4;cursor:not-allowed;}
.btn-migrate:active:not(:disabled){transform:scale(.98);}

/* Progress */
.progress-wrap{display:none;margin-top:16px;}
.progress-wrap.show{display:block;}
.progress-bar-bg{background:#070e07;border-radius:4px;height:6px;overflow:hidden;margin-bottom:8px;}
.progress-bar{background:linear-gradient(90deg,#2a5a2e,#3d8a4e);height:100%;width:0%;border-radius:4px;transition:width .3s;}
.progress-log{background:#070e07;border:1px solid #1a3a1e;border-radius:8px;padding:10px 12px;height:160px;overflow-y:auto;font-family:'Space Mono',monospace;font-size:10px;line-height:1.8;}
.log-line{display:flex;gap:8px;}
.log-line.ok{color:#4a9a4e;}
.log-line.err{color:#9a4a4a;}
.log-line.info{color:#4a7a8e;}
.log-line.warn{color:#8e7a2e;}
.log-ts{color:#2a4a2a;flex-shrink:0;}

/* Summary */
.summary{display:none;background:#0a1a0a;border:1px solid #2a5a2e;border-radius:10px;padding:14px 16px;margin-top:14px;font-size:13px;}
.summary.show{display:block;}
.sum-title{font-family:'Space Mono',monospace;font-size:10px;color:#3d8a4e;letter-spacing:1px;margin-bottom:10px;}
.sum-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #0f1e12;}
.sum-row:last-child{border-bottom:none;}
.sum-v{font-family:'Space Mono',monospace;font-weight:700;color:#c8e4b8;}
</style>
</head>
<body>

<h1>🏕️ Migrazione Database</h1>
<div class="sub">str3pcamp → strepcamp · trasferimento spots</div>

<div class="dbs">
  <!-- OLD DB -->
  <div class="db-card" id="card-old">
    <h2>📦 VECCHIO DB</h2>
    <div class="db-badge loading" id="badge-old">⏳ Connessione...</div>
    <div class="stat-row">
      <span>Spots trovati</span>
      <span class="stat-n" id="old-count">—</span>
    </div>
    <div class="spot-list" id="old-list"></div>
  </div>

  <div class="arrow">→</div>

  <!-- NEW DB -->
  <div class="db-card" id="card-new">
    <h2>🆕 NUOVO DB</h2>
    <div class="db-badge loading" id="badge-new">⏳ Connessione...</div>
    <div class="stat-row">
      <span>Spots presenti</span>
      <span class="stat-n" id="new-count">—</span>
    </div>
    <div class="spot-list" id="new-list"></div>
  </div>
</div>

<!-- MIGRATE PANEL -->
<div class="migrate-panel">
  <h2>⚙️ OPZIONI TRASFERIMENTO</h2>
  <div class="options">
    <label class="opt sel" id="opt-merge-label">
      <input type="radio" name="mode" value="merge" checked onchange="selectMode(this.value)">
      <div>
        <div class="opt-title">🔀 Unisci (merge)</div>
        <div class="opt-desc">Aggiunge solo gli spot del vecchio DB che non esistono ancora nel nuovo. Gli spot già presenti nel nuovo non vengono toccati.</div>
      </div>
    </label>
    <label class="opt" id="opt-overwrite-label">
      <input type="radio" name="mode" value="overwrite" onchange="selectMode(this.value)">
      <div>
        <div class="opt-title">♻️ Sovrascrivi tutto</div>
        <div class="opt-desc">Cancella tutti gli spot nel nuovo DB e ricopia quelli del vecchio. Utile per una migrazione pulita.</div>
      </div>
    </label>
    <label class="opt" id="opt-skip-label">
      <input type="radio" name="mode" value="skip" onchange="selectMode(this.value)">
      <div>
        <div class="opt-title">➕ Solo nuovi (skip duplicati)</div>
        <div class="opt-desc">Trasferisce solo gli spot con ID non presenti nel nuovo DB. Simile al merge ma non controlla il nome, solo l'ID.</div>
      </div>
    </label>
  </div>

  <button class="btn-migrate" id="btn-go" onclick="startMigration()" disabled>
    🚀 TRASFERISCI
  </button>

  <!-- PROGRESS -->
  <div class="progress-wrap" id="progress-wrap">
    <div class="progress-bar-bg"><div class="progress-bar" id="progress-bar"></div></div>
    <div class="progress-log" id="progress-log"></div>
  </div>

  <!-- SUMMARY -->
  <div class="summary" id="summary">
    <div class="sum-title">✅ RIEPILOGO MIGRAZIONE</div>
    <div class="sum-row"><span>Spots trasferiti</span><span class="sum-v" id="sum-transferred">0</span></div>
    <div class="sum-row"><span>Già presenti / saltati</span><span class="sum-v" id="sum-skipped">0</span></div>
    <div class="sum-row"><span>Errori</span><span class="sum-v" id="sum-errors">0</span></div>
    <div class="sum-row"><span>Totale nel nuovo DB</span><span class="sum-v" id="sum-total">0</span></div>
  </div>
</div>

<script type="module">
// ── CONFIG ────────────────────────────────────────────────────
const OLD_CONFIG = {
  apiKey:            "AIzaSyDyNA-JKG9MIx6Sf6C-PqoXPUcB7t9ztgg",
  authDomain:        "str3pcamp.firebaseapp.com",
  projectId:         "str3pcamp",
  storageBucket:     "str3pcamp.firebasestorage.app",
  messagingSenderId: "369800626471",
  appId:             "1:369800626471:web:540b6bf2f4f0a5b3b32902"
};

const NEW_CONFIG = {
  apiKey:            "AIzaSyADUSmmfmYIB_7zQNC9YvPJ4yKHQfdoSgQ",
  authDomain:        "strepcamp.firebaseapp.com",
  projectId:         "strepcamp",
  storageBucket:     "strepcamp.firebasestorage.app",
  messagingSenderId: "733597281103",
  appId:             "1:733597281103:web:55ddade1f918ccd686733a"
};

// ── FIREBASE INIT ─────────────────────────────────────────────
import { initializeApp }                          from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc,
         getDocs, setDoc, deleteDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

let dbOld, dbNew;
let oldSpots = [], newSpots = [];
let migrationMode = 'merge';

function setBadge(id, status, text) {
  const el = document.getElementById(id);
  el.className = 'db-badge ' + status;
  el.textContent = text;
}

function log(msg, type = 'info') {
  const wrap = document.getElementById('progress-log');
  const now = new Date().toLocaleTimeString('it-IT', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const icon = {ok:'✓', err:'✗', info:'·', warn:'⚠'}[type] || '·';
  const line = document.createElement('div');
  line.className = 'log-line ' + type;
  line.innerHTML = `<span class="log-ts">${now}</span><span>${icon} ${msg}</span>`;
  wrap.appendChild(line);
  wrap.scrollTop = wrap.scrollHeight;
}

function setProgress(pct) {
  document.getElementById('progress-bar').style.width = pct + '%';
}

async function loadDB(config, name, badgeId, countId, listId) {
  try {
    const app = initializeApp(config, name);
    const db  = getFirestore(app);
    const snap = await getDocs(collection(db, 'spots'));
    const spots = snap.docs.map(d => ({ ...d.data(), id: d.id }));

    setBadge(badgeId, 'online', `☁️ Connesso · ${spots.length} spots`);
    document.getElementById(countId).textContent = spots.length;

    const listEl = document.getElementById(listId);
    listEl.innerHTML = spots.length === 0
      ? '<div style="font-family:Space Mono,monospace;font-size:10px;color:#2a5a2e;padding:8px 6px;">Nessuno spot trovato</div>'
      : spots.map(s => {
          const dot = s.spotType === 'camping' ? 'camping' : s.spotType === 'accoglienza' ? 'accoglienza' : 'libero';
          return `<div class="spot-item">
            <div class="spot-dot dot-${dot}"></div>
            <div class="spot-name">${s.name || '(senza nome)'}</div>
            <div class="spot-region">${(s.region||'').split('·')[0].trim()}</div>
          </div>`;
        }).join('');

    return { db, spots };
  } catch(e) {
    setBadge(badgeId, 'error', `✗ Errore: ${e.code || e.message}`);
    document.getElementById(countId).textContent = '!';
    console.error(name, e);
    return null;
  }
}

// ── INIT ──────────────────────────────────────────────────────
(async () => {
  const [resOld, resNew] = await Promise.all([
    loadDB(OLD_CONFIG, 'old-db', 'badge-old', 'old-count', 'old-list'),
    loadDB(NEW_CONFIG, 'new-db', 'badge-new', 'new-count', 'new-list'),
  ]);

  if (resOld) { dbOld = resOld.db; oldSpots = resOld.spots; }
  if (resNew) { dbNew = resNew.db; newSpots = resNew.spots; }

  if (resOld && resNew) {
    document.getElementById('btn-go').disabled = false;
  }
})();

// ── UI ────────────────────────────────────────────────────────
window.selectMode = function(v) {
  migrationMode = v;
  ['merge','overwrite','skip'].forEach(m => {
    document.getElementById('opt-' + m + '-label').classList.toggle('sel', m === v);
  });
};

// ── MIGRATION ─────────────────────────────────────────────────
window.startMigration = async function() {
  if (!dbOld || !dbNew) { alert('Entrambi i DB devono essere connessi.'); return; }
  if (oldSpots.length === 0) { alert('Nessuno spot nel vecchio DB da trasferire.'); return; }

  document.getElementById('btn-go').disabled = true;
  document.getElementById('progress-wrap').classList.add('show');
  document.getElementById('summary').classList.remove('show');
  document.getElementById('progress-log').innerHTML = '';
  setProgress(0);

  let transferred = 0, skipped = 0, errors = 0;

  log(`Modalità: ${migrationMode}`, 'info');
  log(`Spots nel vecchio DB: ${oldSpots.length}`, 'info');
  log(`Spots nel nuovo DB: ${newSpots.length}`, 'info');
  log('─────────────────────────────', 'info');

  // OVERWRITE: cancella tutto il nuovo DB prima
  if (migrationMode === 'overwrite') {
    log('Cancellazione spots nel nuovo DB...', 'warn');
    try {
      const batch = writeBatch(dbNew);
      const snap = await getDocs(collection(dbNew, 'spots'));
      snap.docs.forEach(d => batch.delete(d.ref));
      await batch.commit();
      newSpots = [];
      log(`Eliminati ${snap.size} spots dal nuovo DB`, 'warn');
    } catch(e) {
      log('Errore durante la cancellazione: ' + e.message, 'err');
    }
    setProgress(10);
  }

  // Build lookup set of existing IDs/names in new DB
  const newIds   = new Set(newSpots.map(s => String(s.id)));
  const newNames = new Set(newSpots.map(s => (s.name||'').toLowerCase().trim()));

  const total = oldSpots.length;

  for (let i = 0; i < total; i++) {
    const spot = oldSpots[i];
    const sid  = String(spot.id);

    // Skip check depending on mode
    if (migrationMode === 'merge') {
      const nameMatch = newNames.has((spot.name||'').toLowerCase().trim());
      const idMatch   = newIds.has(sid);
      if (nameMatch || idMatch) {
        log(`Saltato (già presente): ${spot.name}`, 'warn');
        skipped++;
        setProgress(10 + Math.round(((i+1)/total) * 88));
        continue;
      }
    } else if (migrationMode === 'skip') {
      if (newIds.has(sid)) {
        log(`Saltato (ID duplicato): ${spot.name}`, 'warn');
        skipped++;
        setProgress(10 + Math.round(((i+1)/total) * 88));
        continue;
      }
    }

    // Write to new DB
    try {
      await setDoc(doc(dbNew, 'spots', sid), spot);
      log(`Trasferito: ${spot.name}`, 'ok');
      transferred++;
      newIds.add(sid);
      newNames.add((spot.name||'').toLowerCase().trim());
    } catch(e) {
      log(`Errore su "${spot.name}": ${e.message}`, 'err');
      errors++;
    }

    setProgress(10 + Math.round(((i+1)/total) * 88));
    // small delay to avoid hammering quota
    await new Promise(r => setTimeout(r, 80));
  }

  setProgress(100);
  log('─────────────────────────────', 'info');
  log(`Completato. Trasferiti: ${transferred} · Saltati: ${skipped} · Errori: ${errors}`, transferred > 0 ? 'ok' : 'warn');

  // Reload new count
  const snapFinal = await getDocs(collection(dbNew, 'spots'));

  document.getElementById('sum-transferred').textContent = transferred;
  document.getElementById('sum-skipped').textContent     = skipped;
  document.getElementById('sum-errors').textContent      = errors;
  document.getElementById('sum-total').textContent       = snapFinal.size;
  document.getElementById('summary').classList.add('show');

  // Refresh new DB card
  document.getElementById('new-count').textContent = snapFinal.size;
  setBadge('badge-new', 'online', `☁️ ${snapFinal.size} spots`);
  document.getElementById('btn-go').disabled = false;
};
</script>
</body>
</html>
